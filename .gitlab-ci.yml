stages:
  - build
  - deploy

# Global workflow rules control pipeline generation before any jobs evaluate
workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE == "build"'
      when: always
    - when: never

image: node:24
cache:
  - key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  - key: plugins-$CI_COMMIT_REF_SLUG
    paths:
      - .quartz/plugins/

build:
  stage: build
  before_script:
    - hash -r
    - npm ci --cache .npm --prefer-offline
  script:
    - npx quartz plugin install
    - npx quartz build
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public