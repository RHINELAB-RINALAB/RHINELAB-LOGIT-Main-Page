stages:
  - build
  - deploy

image: node:24
cache:
  - key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  - key: plugins-$CI_COMMIT_REF_SLUG
    paths:
      - .quartz/plugins/

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "build"'
  before_script:
    - hash -r
    - npm ci --cache .npm --prefer-offline
  script:
    - npx quartz plugin install
    - npx quartz build
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_REF_NAME == "build"'
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public